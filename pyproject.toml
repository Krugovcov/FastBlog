[project]
name = "fastblog"
version = "0.1.0"
description = "simple full-stack blog platform built for learning and team collaboration. The project demonstrates frontend-backend integration using FastAPI, PostgreSQL, and React/Next.js. Features include authentication, blog posts, comments, likes, user profiles, and a REST API."
authors = [
    {name = "Matviy",email = "krugovcovmatvey@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "sqlalchemy (>=2.0.50,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
